<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nexora </title>
  <!-- Favicon & ikon aplikasi -->
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <!-- PWA: bisa dipasang di layar HP -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexora">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/role-guard.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e6edf3; }
    .login-card { background: #161b22; border: 1px solid #30363d; padding: 32px 28px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h2 { font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .brand-header p { font-size: 12px; color: #8b949e; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 500; color: #8b949e; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8b949e; font-size: 13px; }
    .input-wrapper input { width: 100%; padding: 10px 12px 10px 36px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
    .input-wrapper input:focus { border-color: #17A897; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
    .btn:disabled { cursor: not-allowed; }
    .btn-primary { background: #17A897; color: white; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 12px; }
    .card-footer a { color: #58a6ff; text-decoration: none; }
    .divider { margin: 16px 0; border: none; border-top: 1px solid #30363d; }
    .version-text { text-align: center; margin-top: 20px; font-size: 11px; color: #484f58; }
    .auth-logo { display: block; margin: 0 auto 14px; height: 64px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 0 14px rgba(23, 168, 151, 0.35)); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <img class="auth-logo" src="img/nexora-logo.png" alt="Logo Nexora" width="93" height="64" onerror="this.hidden=true;">
      <h2>Nexora</h2>
      <p>Silakan masuk ke akun Anda</p>
    </div>
    
    <div class="input-group">
      <label>Email</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="login-email" placeholder="nama@email.com" />
      </div>
    </div>
    
    <div class="input-group">
      <label>Password</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
    </div>
    
    <button class="btn btn-primary" onclick="processLogin()">Masuk</button>

    <hr class="divider">

    <div class="card-footer">
      <a href="forgot.html">Lupa password?</a>
      <a href="register.html">Daftar Pemilik</a>
    </div>

    <div class="version-text">Nexora Business Center (Cloud)</div>
  </div>

  <script>
    const sbAuth = window.supabaseClient;
    // Alamat index.html relatif terhadap halaman ini (aman walau di-hosting di subfolder)
    const INDEX_URL = new URL('index.html', window.location.href).href;

    // Role dibaca dari database (bukan localStorage), lalu diarahkan ke halaman yang sesuai.
    // Akun nonaktif / cabang nonaktif / tanpa role ditolak dan sesinya dicabut.
    async function routeAfterAuth(isFreshLogin) {
      let me;
      try {
        me = await NexoraAuth.whoami(sbAuth);
      } catch (err) {
        console.error('Gagal memverifikasi akun:', err);
        notify('Tidak dapat memverifikasi akun. Periksa koneksi lalu coba lagi.', 'error', 6000);
        setBusy(false);
        return;
      }
      if (!me || !me.allowed) {
        await sbAuth.auth.signOut();
        const reason = me && me.reason;

        // JIKA MASA LANGGANAN HABIS: Tampilkan notifikasi & langsung buka WA Admin
        if (reason === 'subscription_expired') {
          const wa = (window.NexoraAuth && window.NexoraAuth.DEVELOPER_WA) || '625780243664';
          const msg = encodeURIComponent('Halo Admin Nexora, masa trial bisnis saya sudah habis. Saya ingin perpanjang langganan akun kasir Nexora.');
          const waUrl = `https://api.whatsapp.com/send?phone=${wa}&text=${msg}`;

          notify('Masa aktif bisnis Anda telah berakhir. Menghubungkan ke WhatsApp Admin untuk perpanjang...', 'warning', 4000);
          setTimeout(() => {
            window.open(waUrl, '_blank');
          }, 1500);
        } else {
          notify(NexoraAuth.blockMessage(reason), 'error', 6000);
        }

        setBusy(false);
        return;
      }
      if (isFreshLogin) {
        try { await sbAuth.rpc('nx_log_auth_event', { p_type: 'LOGIN' }); } catch (e) { /* log gagal tidak menghalangi masuk */ }
      }
      window.location.replace(new URL(NexoraAuth.homeFor(me), window.location.href).href);
    }

    function setBusy(isBusy) {
      document.querySelectorAll('.btn').forEach(b => { b.disabled = isBusy; b.style.opacity = isBusy ? '0.6' : '1'; });
    }

    // Jika sudah punya sesi valid, langsung masuk ke dashboard.
    // Error jaringan TIDAK menyebabkan redirect (mencegah loop login <-> index).
    window.addEventListener('DOMContentLoaded', async () => {
      if (!sbAuth) {
        notify('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.', 'error', 7000);
        return;
      }
      try {
        const { data, error } = await sbAuth.auth.getSession();
        if (!error && data.session && data.session.user) {
          await routeAfterAuth(false);
        }
      } catch (err) {
        console.error('Gagal memeriksa sesi:', err);
      }
      try {
        const m = sessionStorage.getItem('nx_login_msg');
        if (m) { sessionStorage.removeItem('nx_login_msg'); notify(m, 'error', 6000); }
      } catch (e) { /* abaikan */ }
    });

    // Tekan Enter di kolom email/password = Masuk
    ['login-email', 'login-password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') processLogin();
      });
    });

    async function processLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return notify('Email dan password wajib diisi.', 'warning');

      setBusy(true);
      try {
        const { error } = await sbAuth.auth.signInWithPassword({ email, password });
        if (error) {
          notify(authMessage(error), 'error');
          setBusy(false);
          return;
        }
        await routeAfterAuth(true);
      } catch (err) {
        notify(authMessage(err), 'error');
        setBusy(false);
      }
    }
  </script>
</body>
</html>
