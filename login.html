<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SakaPay v2.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e6edf3; }
    .login-card { background: #161b22; border: 1px solid #30363d; padding: 32px 28px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h2 { font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .brand-header p { font-size: 12px; color: #8b949e; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 500; color: #8b949e; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8b949e; font-size: 13px; }
    .input-wrapper input { width: 100%; padding: 10px 12px 10px 36px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
    .input-wrapper input:focus { border-color: #17A897; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
    .btn-primary { background: #17A897; color: white; }
    .btn-google { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 12px; }
    .card-footer a { color: #58a6ff; text-decoration: none; }
    .divider { margin: 16px 0; border: none; border-top: 1px solid #30363d; }
    .version-text { text-align: center; margin-top: 20px; font-size: 11px; color: #484f58; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <h2>SakaPay v2.1</h2>
      <p>Silakan masuk ke akun Anda</p>
    </div>
    
    <div class="input-group">
      <label>Email</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="login-email" placeholder="nama@email.com" />
      </div>
    </div>
    
    <div class="input-group">
      <label>Password</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
    </div>
    
    <button class="btn btn-primary" onclick="processLogin()">Masuk</button>
    <button class="btn btn-google" onclick="processGoogleLogin()">
      <i class="fa-brands fa-google" style="color: #db4437;"></i> Masuk dengan Google
    </button>

    <hr class="divider">

    <div class="card-footer">
      <a href="#" onclick="alert('Silakan hubungi administrator.')">Lupa password?</a>
      <a href="#" onclick="processRegister()">Daftar Akun</a>
    </div>

    <div class="version-text">SakaPay Business Center (Cloud)</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
  // Beri jeda sedikit atau pastikan benar-benar ada sesi valid sebelum redirect
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session && session.user) {
    // Hanya lempar ke index.html jika tidak sedang berada di halaman index
    if (!window.location.pathname.includes('index.html')) {
      window.location.href = 'index.html';
    }
  }
});

    async function processLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      if (!email || !password) return alert('Email dan password wajib diisi!');
      
      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Gagal Login: ' + error.message);
      else window.location.href = 'index.html';
    }

    async function processRegister() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      if (!email || !password) return alert('Isi email dan password terlebih dahulu!');

      const { error } = await window.supabaseClient.auth.signUp({ email, password });
      if (error) alert('Gagal Daftar: ' + error.message);
      else alert('Pendaftaran berhasil! Silakan klik Masuk.');
    }

    async function processGoogleLogin() {
      const { error } = await window.supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/index.html' }
      });
      if (error) alert('Gagal Google Login: ' + error.message);
    }
  </script>
</body>
</html>
