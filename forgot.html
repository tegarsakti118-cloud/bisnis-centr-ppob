<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - SakaPay v2.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e6edf3; }
    .login-card { background: #161b22; border: 1px solid #30363d; padding: 32px 28px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h2 { font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .brand-header p { font-size: 12px; color: #8b949e; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 500; color: #8b949e; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8b949e; font-size: 13px; }
    .input-wrapper input { width: 100%; padding: 10px 12px 10px 36px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
    .input-wrapper input:focus { border-color: #17A897; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
    .btn:disabled { cursor: not-allowed; }
    .btn-primary { background: #17A897; color: white; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 12px; }
    .card-footer a { color: #58a6ff; text-decoration: none; }
    .divider { margin: 16px 0; border: none; border-top: 1px solid #30363d; }
    .version-text { text-align: center; margin-top: 20px; font-size: 11px; color: #484f58; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <h2>Lupa Password</h2>
      <p id="forgot-sub">Masukkan email akun Anda. Kami kirim kode verifikasi.</p>
    </div>

    <!-- LANGKAH 1: email -->
    <div id="step-email">
      <div class="input-group">
        <label>Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="forgot-email" placeholder="nama@email.com" autocomplete="email" />
        </div>
      </div>
      <button class="btn btn-primary" id="btn-send" onclick="sendCode()">Kirim Kode</button>
    </div>

    <!-- LANGKAH 2: kode OTP + password baru -->
    <div id="step-code" style="display:none;">
      <div class="input-group">
        <label>Kode dari Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key"></i>
          <input type="text" id="otp-code" inputmode="numeric" maxlength="10" placeholder="Masukkan kode" autocomplete="one-time-code" />
        </div>
      </div>
      <div class="input-group">
        <label>Password Baru (minimal 6 karakter)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password" />
        </div>
      </div>
      <div class="input-group">
        <label>Ulangi Password Baru</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="new-password2" placeholder="••••••••" autocomplete="new-password" />
        </div>
      </div>
      <button class="btn btn-primary" id="btn-reset" onclick="resetWithCode()">Simpan Password Baru</button>
      <button class="btn btn-secondary" id="btn-resend" onclick="sendCode(true)" disabled>Kirim ulang kode</button>
    </div>

    <hr class="divider">

    <div class="card-footer" style="justify-content: center;">
      <a href="login.html">Kembali ke Login</a>
    </div>

    <div class="version-text">SakaPay Business Center (Cloud)</div>
  </div>

  <style>
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn:disabled { cursor: not-allowed; }
  </style>

  <script>
    const sbAuth = window.supabaseClient;
    const LOGIN_URL = new URL('login.html', window.location.href).href;
    const RESEND_SECONDS = 60;

    let currentEmail = '';
    let busy = false;
    let resendTimer = null;

    function setBusy(isBusy) {
      busy = isBusy;
      document.querySelectorAll('.btn').forEach(b => { b.style.opacity = isBusy ? '0.6' : '1'; });
      ['btn-send', 'btn-reset'].forEach(id => { const el = document.getElementById(id); if (el) el.disabled = isBusy; });
    }

    function startResendCountdown() {
      const btn = document.getElementById('btn-resend');
      let left = RESEND_SECONDS;
      btn.disabled = true;
      clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(resendTimer);
          btn.disabled = false;
          btn.textContent = 'Kirim ulang kode';
        } else {
          btn.textContent = 'Kirim ulang kode (' + left + ' dtk)';
        }
      }, 1000);
      btn.textContent = 'Kirim ulang kode (' + left + ' dtk)';
    }

    document.getElementById('forgot-email').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCode(); });
    ['otp-code', 'new-password', 'new-password2'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') resetWithCode(); });
    });

    // Langkah 1: kirim kode ke email
    async function sendCode(isResend) {
      if (busy) return;
      if (!sbAuth) return alert('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');

      const email = isResend ? currentEmail : document.getElementById('forgot-email').value.trim();
      if (!email) return alert('Isi email terlebih dahulu!');

      setBusy(true);
      try {
        const { error } = await sbAuth.auth.resetPasswordForEmail(email);
        if (error) {
          alert('Gagal mengirim kode: ' + error.message);
          setBusy(false);
          return;
        }
        currentEmail = email;
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-code').style.display = 'block';
        document.getElementById('forgot-sub').textContent = 'Kode dikirim ke ' + email + '. Cek inbox atau folder spam.';
        startResendCountdown();
        if (isResend) alert('Kode baru sudah dikirim.');
      } catch (err) {
        alert('Gagal mengirim kode: ' + (err.message || err));
      }
      setBusy(false);
    }

    // Langkah 2: verifikasi kode lalu ganti password
    async function resetWithCode() {
      if (busy) return;
      const token = document.getElementById('otp-code').value.replace(/\s/g, '');
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('new-password2').value;

      if (!token || !p1 || !p2) return alert('Semua kolom wajib diisi!');
      if (!/^\d{6,10}$/.test(token)) return alert('Kode harus berupa angka (6-10 digit).');
      if (p1.length < 6) return alert('Password minimal 6 karakter.');
      if (p1 !== p2) return alert('Password dan ulangi password tidak sama.');

      setBusy(true);
      try {
        const { error: verifyError } = await sbAuth.auth.verifyOtp({ email: currentEmail, token, type: 'recovery' });
        if (verifyError) {
          alert('Kode salah atau sudah kedaluwarsa: ' + verifyError.message);
          setBusy(false);
          return;
        }

        const { error: updateError } = await sbAuth.auth.updateUser({ password: p1 });
        if (updateError) {
          alert('Gagal mengganti password: ' + updateError.message);
          setBusy(false);
          return;
        }

        await sbAuth.auth.signOut(); // paksa login ulang dengan password baru
        alert('Password berhasil diganti! Silakan masuk dengan password baru.');
        window.location.replace(LOGIN_URL);
      } catch (err) {
        alert('Gagal mengganti password: ' + (err.message || err));
        setBusy(false);
      }
    }
  </script>
</body>
</html>
