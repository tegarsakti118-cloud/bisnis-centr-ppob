<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Pemilik - Nexora</title>
  <!-- Favicon & ikon aplikasi -->
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <!-- PWA: bisa dipasang di layar HP -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexora">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/role-guard.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e6edf3; }
    .login-card { background: #161b22; border: 1px solid #30363d; padding: 32px 28px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h2 { font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .brand-header p { font-size: 12px; color: #8b949e; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 500; color: #8b949e; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8b949e; font-size: 13px; }
    .input-wrapper input { width: 100%; padding: 10px 12px 10px 36px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
    .input-wrapper input:focus { border-color: #17A897; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
    .btn:disabled { cursor: not-allowed; }
    .btn-primary { background: #17A897; color: white; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 12px; }
    .card-footer a { color: #58a6ff; text-decoration: none; }
    .divider { margin: 16px 0; border: none; border-top: 1px solid #30363d; }
    .version-text { text-align: center; margin-top: 20px; font-size: 11px; color: #484f58; }
    .auth-logo { display: block; margin: 0 auto 14px; height: 64px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 0 14px rgba(23, 168, 151, 0.35)); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <img class="auth-logo" src="img/nexora-logo.png" alt="Logo Nexora" width="93" height="64" onerror="this.hidden=true;">
      <h2>Daftar Pemilik</h2>
      <p>Buat akun pemilik bisnis Nexora. Perlu kode aktivasi.</p>
    </div>

    <div class="input-group">
      <label>Nama Lengkap</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="reg-name" placeholder="Nama Anda" autocomplete="name" />
      </div>
    </div>
    <div class="input-group">
      <label>Nama Bisnis</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-store"></i>
        <input type="text" id="reg-business" placeholder="Contoh: Saka Pay" autocomplete="organization" />
      </div>
    </div>
    <div class="input-group">
      <label>Email</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="reg-email" placeholder="nama@email.com" autocomplete="email" />
      </div>
    </div>
    <div class="input-group">
      <label>Username</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-at"></i>
        <input type="text" id="reg-username" placeholder="huruf kecil, angka, titik, _" autocomplete="username" autocapitalize="none" />
      </div>
    </div>
    <div class="input-group">
      <label>Password (minimal 8 karakter)</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" />
      </div>
    </div>
    <div class="input-group">
      <label>Ulangi Password</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="reg-password2" placeholder="••••••••" autocomplete="new-password" />
      </div>
    </div>

    <button class="btn btn-primary" id="btn-register" onclick="processRegister()">Daftar</button>

    <hr class="divider">

    <div class="card-footer" style="justify-content: center;">
      <span style="color:#8b949e;">Sudah punya akun?&nbsp;</span><a href="login.html">Masuk</a>
    </div>

    <div class="version-text">Nexora Business Center (Cloud)</div>
  </div>

  <script>
    const sbAuth = window.supabaseClient;

    function setBusy(isBusy) {
      document.querySelectorAll('.btn').forEach(b => { b.disabled = isBusy; b.style.opacity = isBusy ? '0.6' : '1'; });
    }

    // Kalau sudah login, tidak perlu daftar lagi
    window.addEventListener('DOMContentLoaded', async () => {
      if (!sbAuth) {
        notify('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.', 'error', 7000);
        return;
      }
      try {
        const { data, error } = await sbAuth.auth.getSession();
        if (!error && data.session && data.session.user) window.location.replace(new URL('login.html', window.location.href).href);
      } catch (err) {
        console.error('Gagal memeriksa sesi:', err);
      }
    });

    ['reg-name', 'reg-business', 'reg-email', 'reg-username', 'reg-password', 'reg-password2'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') processRegister();
      });
    });

    // Pesan error dari Edge Function (respon non-2xx)
    async function functionError(error) {
      try {
        if (error && error.context && typeof error.context.json === 'function') {
          const body = await error.context.json();
          if (body && body.error) return body.error;
        }
      } catch (e) { /* abaikan */ }
      return authMessage(error);
    }

    async function processRegister() {
      const v = id => document.getElementById(id).value;
      const full_name = v('reg-name').trim();
      const business_name = v('reg-business').trim();
      const email = v('reg-email').trim();
      const username = v('reg-username').trim().toLowerCase();
      const password = v('reg-password');
      const password2 = v('reg-password2');

      if (!full_name || !business_name || !email || !username || !password || !password2) {
        return notify('Semua kolom wajib diisi.', 'warning');
      }
      if (!/^[a-z0-9_.]{3,30}$/.test(username)) {
        return notify('Username 3-30 karakter: huruf kecil, angka, titik, atau garis bawah.', 'warning');
      }
      if (password.length < 8) return notify('Password minimal 8 karakter.', 'warning');
      if (password !== password2) return notify('Password dan ulangi password tidak sama.', 'warning');

      setBusy(true);
      try {
        // Panggil fungsi database registrasi trial 7 hari secara langsung
        const { data, error } = await sbAuth.rpc('nx_register_new_owner', {
          p_full_name: full_name,
          p_business_name: business_name,
          p_email: email,
          p_username: username,
          p_password: password
        });

        if (error || (data && !data.success)) {
          const errMsg = (data && data.error) || (error && error.message) || 'Pendaftaran gagal.';
          notify(errMsg, 'error', 6000);
          setBusy(false);
          return;
        }

        // Otomatis login begitu selesai daftar
        const login = await sbAuth.auth.signInWithPassword({ email, password });
        if (login.error) {
          await notify('Pendaftaran berhasil! Silakan login dengan akun Anda.', 'success', 2500);
          window.location.replace(new URL('login.html', window.location.href).href);
          return;
        }

        try { await sbAuth.rpc('nx_log_auth_event', { p_type: 'LOGIN' }); } catch (e) { /* abaikan */ }
        await notify('Pendaftaran berhasil! Selamat mencoba Trial 7 Hari.', 'success', 1500);
        window.location.replace(new URL('index.html', window.location.href).href);
        return;
      } catch (err) {
        notify(authMessage(err), 'error');
      }
      setBusy(false);
    }
  </script>
</body>
</html>
